services:
  - type: web
    name: pip-found-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://piplad-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html